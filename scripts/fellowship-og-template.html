<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fellowship OG Template</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #030303;
      font-family: 'Inter', sans-serif;
      padding: 30px;
    }

    .frame {
      width: 1140px;
      height: 570px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 28px;
      background: #050506;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 56px 72px 48px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.85);
    }

    /* Ambient mesh glows */
    .glow-cyan {
      position: absolute;
      bottom: -160px;
      left: -100px;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }

    .glow-indigo {
      position: absolute;
      top: -140px;
      left: 320px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }

    /* Subtle grid pattern */
    .frame::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 48px 48px;
      z-index: 1;
      pointer-events: none;
    }

    /* Background Photo with Cinematic Fade */
    .photo-backdrop {
      position: absolute;
      top: 0;
      right: 0;
      width: 620px;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .photo-backdrop img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      opacity: 0.32;
      filter: grayscale(35%) contrast(115%) brightness(0.9);
    }

    .photo-fade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to right,
          #050506 0%,
          rgba(5, 5, 6, 0.95) 20%,
          rgba(5, 5, 6, 0.6) 55%,
          rgba(5, 5, 6, 0.3) 85%,
          rgba(5, 5, 6, 0.6) 100%
        ),
        linear-gradient(
          to bottom,
          rgba(5, 5, 6, 0.8) 0%,
          transparent 20%,
          transparent 80%,
          rgba(5, 5, 6, 0.9) 100%
        );
    }

    /* Top row: Brand & tag */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .logo {
      height: 24px;
      width: auto;
      opacity: 0.85;
    }

    .series-badge {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(250, 250, 250, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 5px 14px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(8px);
    }

    /* Main content */
    .main-content {
      position: relative;
      z-index: 2;
      max-width: 660px;
      margin-top: 10px;
    }

    .category {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 5px;
      color: #60a5fa;
      margin-bottom: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .category::before {
      content: '';
      width: 18px;
      height: 1px;
      background: #60a5fa;
      opacity: 0.8;
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: 56px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.04;
      margin-bottom: 16px;
      letter-spacing: -2px;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 300;
      color: #a1a1aa;
      line-height: 1.5;
      margin-bottom: 26px;
      max-width: 580px;
    }

    /* Project chips */
    .project-chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(250, 250, 250, 0.75);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
    }

    .chip-num {
      color: #60a5fa;
      font-weight: 600;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 18px;
      position: relative;
      z-index: 2;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .author {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13px;
      color: #fafafa;
      letter-spacing: 0.5px;
    }

    .dot {
      color: rgba(255, 255, 255, 0.2);
    }

    .role {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 12px;
      color: #71717a;
    }

    .url {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      color: rgba(250, 250, 250, 0.35);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <!-- Ambient glows -->
    <div class="glow-cyan"></div>
    <div class="glow-indigo"></div>

    <!-- Faded Photo Backdrop -->
    <div class="photo-backdrop">
      <img id="fellowshipPhoto" src="" alt="Fellowship work session" />
      <div class="photo-fade"></div>
    </div>

    <!-- Top bar -->
    <div class="top-bar">
      <img id="brandLogo" class="logo" src="" alt="Logo" />
      <span class="series-badge">4 Projects · 1 Repo</span>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="category">FELLOWSHIP // LEARN2EARN</div>
      <h1 class="title">Python Project Series</h1>
      <p class="subtitle">
        A documented series of production-style Python projects, real bugs, and what each build taught me.
      </p>
      
      <div class="project-chips">
        <div class="chip"><span class="chip-num">01</span> CLI Book</div>
        <div class="chip"><span class="chip-num">02</span> AI Agent</div>
        <div class="chip"><span class="chip-num">03</span> PDF Engine</div>
        <div class="chip"><span class="chip-num">04</span> GUI Game</div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-left">
        <span class="author">Yekeen Maadan</span>
        <span class="dot">•</span>
        <span class="role">Software Developer</span>
      </div>
      <div class="url">maadan.dev/fellowship</div>
    </div>
  </div>
</body>
</html>
